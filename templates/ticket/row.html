<tr id="ticket-{{ ticket.id }}" class="ind-tr-hover">
    <td class="ind-td" style="width: 2.5em;"><i class="fa {% if ticket.is_open %}fa-exclamation-circle{% else %}fa-check-circle-o{% endif %}"></i>
        <i class="fa {% if ticket.is_contributive%}fa-arrow-up{% else %}fa-minus{% endif %}"></i></td>
    <td class="ind-td">{{ ticket.id }}</td>
    <td class="ind-td"><a href="{{ url('ticket', ticket.id) }}">{{ ticket.title }}</a></td>
    <td class="ind-td">{{ link_user(ticket.user) }}</td>
    <td class="ind-td">{{ link_users(ticket.assignees.all()) }}</td>
</tr>
