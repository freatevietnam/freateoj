<section class="brutalist-panel brutalist-border ind-panel" id="activity-feed-panel">
    <header class="ind-panel-header">{{ _('Recent Activity') }}</header>
    <div class="panel-content ind-panel-content ind-panel-content-activity">
        <div id="activity-timeline" class="ind-timeline">
            {% for activity in recent_activity %}
            <div class="ind-timeline-item">
                <div class="ind-timeline-dot"></div>
                <div class="data-label ind-label-sm">{{ activity.timestamp }}</div>
                <div class="ind-timeline-text">{{ activity.html|safe }}</div>
            </div>
            {% else %}
            <div class="ind-placeholder ind-placeholder-md">{{ _('No recent activity.') }}</div>
            {% endfor %}
        </div>
        {% if has_more_activity %}
        <button class="ind-btn-wide brutalist-btn" data-load-more-activity>{{ _('Load more...') }}</button>
        {% endif %}
    </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var btn = document.querySelector('[data-load-more-activity]');
    if (!btn) return;
    var offset = {{ recent_activity|length }};
    btn.addEventListener('click', function () {
        fetch('/user/{{ user.user.username }}/activity-feed/?offset=' + offset + '&limit=20')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var timeline = document.getElementById('activity-timeline');
                data.items.forEach(function (item) {
                    var div = document.createElement('div');
                    div.className = 'ind-timeline-item';
                    div.innerHTML = '<div class=\"ind-timeline-dot\"></div>' +
                        '<div class=\"data-label ind-label-sm\">' + item.timestamp + '</div>' +
                        '<div class=\"ind-timeline-text\">' + item.html + '</div>';
                    timeline.appendChild(div);
                    offset++;
                });
                if (!data.has_more) btn.style.display = 'none';
            });
    });
});
</script>
