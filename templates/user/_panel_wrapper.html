<section class="brutalist-panel brutalist-border ind-panel" data-panel="{{ panel_id }}" {% if lazy %}data-lazy="{{ lazy_endpoint }}"{% endif %}>
    {% if title %}
        <header class="ind-panel-header">{{ title }}</header>
    {% endif %}
    <div class="panel-content ind-panel-content">
        {% if lazy %}
            <div class="ind-placeholder ind-placeholder-lg">{{ _('Loading...') }}</div>
        {% else %}
            {{ content }}
        {% endif %}
    </div>
</section>
