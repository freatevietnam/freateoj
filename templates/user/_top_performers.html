{% if top_performers %}
<div class="brutalist-grid top-performers top-performers-grid">
    {% for card in top_performers %}
    <div class="ind-card brutalist-border">
        <div class="data-label">{{ card.label }}</div>
        {% if card.profile %}
        <div class="ind-flex-row ind-mt-4">
            <img src="{{ gravatar(card.profile, 32) }}" class="ind-avatar-md">
            <div>
                <a href="{{ url('user_page', card.profile.user.username) }}" class="ind-username">{{ card.profile.user.username }}</a>
                <div class="data-value ind-value">{{ card.value }}</div>
            </div>
        </div>
        {% else %}
        <div class="ind-mt-4">
            <div class="data-value ind-value">{{ card.value }}</div>
        </div>
        {% endif %}
        {% if card.trend %}
        <div class="data-label ind-mt-4" style="color:{% if card.trend > 0 %}#00C853{% else %}#D50000{% endif %};">{{ '+' if card.trend > 0 }}{{ card.trend }}</div>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% endif %}
