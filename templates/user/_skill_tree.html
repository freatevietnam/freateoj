<section class="brutalist-panel brutalist-border ind-panel" data-panel="skill_tree" id="skill-tree-panel">
    <header class="ind-panel-header">{{ _('Skill Tree') }}</header>
    <div class="panel-content ind-panel-content ind-panel-content-tall">
        <svg id="skill-tree-svg" width="100%" height="380" class="ind-svg-block"></svg>
        <div class="ind-placeholder ind-placeholder-xl">{{ _('Loading skill tree...') }}</div>
    </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('skill-tree-panel');
    if (!el) return;
    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                var script = document.createElement('script');
                script.src = '{{ static("d3.min.js") }}';
                script.onload = function () {
                    fetch('/user/{{ user.user.username }}/skill-tree-data/')
                        .then(function (r) { return r.json(); })
                        .then(function (data) { renderSkillTree(data); });
                };
                document.head.appendChild(script);
                observer.unobserve(el);
            }
        });
    }, { rootMargin: '200px' });
    observer.observe(el);
});
</script>
