{% if users_cards %}
<div class="brutalist-grid cards-grid">
    {% for rank, profile in users_cards %}
    <div class="ind-card ind-card-flex brutalist-border">
        <div class="ind-rank">{{ rank }}</div>
        <img src="{{ gravatar(profile, 40) }}" class="ind-avatar-lg">
        <div class="ind-flex-1">
            <a href="{{ url('user_page', profile.user.username) }}" class="ind-username ind-username-sm">{{ profile.user.username }}</a>
            <div class="ind-flex ind-gap-12 ind-mt-4">
                <span class="data-label">{{ _('Pts') }}</span><span class="data-value ind-value-sm">{{ profile.performance_points|floatformat(1) }}</span>
                <span class="data-label">{{ _('Sol') }}</span><span class="data-value ind-value-sm">{{ profile.problem_count }}</span>
                {% if profile.rating %}<span class="data-label">●</span><span class="data-value ind-value-sm">{{ profile.rating }}</span>{% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
