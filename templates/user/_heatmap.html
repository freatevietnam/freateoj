<section class="brutalist-panel brutalist-border ind-panel" data-panel="heatmap" id="heatmap-panel">
    <header class="ind-panel-header">{{ _('Submission Activity') }}</header>
    <div class="panel-content ind-panel-content ind-panel-content-heatmap">
        <canvas id="heatmap-canvas" width="800" height="280"></canvas>
        <div class="ind-flex-end ind-mt-4">
            <span class="data-label">{{ _('Less') }}</span>
            <span class="ind-swatch ind-swatch-empty"></span>
            <span class="ind-swatch ind-swatch-light"></span>
            <span class="ind-swatch ind-swatch-mid"></span>
            <span class="ind-swatch ind-swatch-full"></span>
            <span class="data-label">{{ _('More') }}</span>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('heatmap-canvas');
    if (!el) return;
    var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            if (entry.isIntersecting) {
                renderHeatmap(el, window.HEATMAP_DATA || {});
                observer.unobserve(el);
            }
        });
    }, { rootMargin: '200px' });
    observer.observe(el);
});
</script>
