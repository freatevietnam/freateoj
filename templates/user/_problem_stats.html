<section class="brutalist-panel brutalist-border ind-panel">
    <header class="ind-panel-header">{{ _('Problem Statistics') }}</header>
    <div class="panel-content ind-panel-content ind-panel-content-table">
        {% if best_submissions %}
        <table class="ind-table ind-table-sm">
            <thead>
                <tr class="ind-tr-border">
                    <th class="ind-th">{{ _('Category') }}</th>
                    <th class="ind-th ind-th-right">{{ _('Solved') }}</th>
                    <th class="ind-th ind-th-right">{{ _('Points') }}</th>
                </tr>
            </thead>
            <tbody>
            {% for group in best_submissions %}
                <tr class="ind-tr-border">
                    <td class="ind-td-mono-sm" style="color:#1A1A1A;">{{ group.name }}</td>
                    <td class="ind-td-mono-sm ind-td-right" style="color:#888888;">{{ group.problems|length }}</td>
                    <td class="ind-td-mono-sm ind-td-right" style="color:#FF6B00;">{{ group.points|floatformat(1) }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="ind-placeholder ind-placeholder-md">{{ _('No problems solved yet.') }}</div>
        {% endif %}
    </div>
</section>
