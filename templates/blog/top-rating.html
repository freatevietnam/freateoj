<div class="blog-sidebox sidebox">
    <h3>{{ _('Top users') }} <i class="fa fa-trophy"></i></h3>
    <div class="sidebox-content" style="padding: unset; border: unset;">
        <div class="ind-table-wrap">
        <table class="ind-table ind-table-md" style="margin-bottom: unset;">
            <thead>
                <tr class="ind-tr-border">
                    <th class="ind-th header rank" style="border-top-left-radius: unset; padding: 4px 9px;"> # </th>
                    <th class="ind-th header username">{{ _('Username') }}</th>
                    <th class="ind-th header points" style="border-top-right-radius: unset;"> {{ _('Rating') }} </th>
                </tr>
            </thead>
            <tbody>
                {% for user in top_rated_users %}
                <tr id="user-{{ loop.index }}" class="ind-tr-hover">
                    <td class="ind-td">{{ loop.index }}</td>
                    <td class="ind-td user-name">
                        <div style="float:left">
                            {{ link_user(user) }}
                        </div>
                    </td>
                    <td class="ind-td user-points {{ user.css_class }}">
                        {{ user.rating }}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
        <div style="position: relative; font-size: smaller; padding: unset;">
            <table class="ind-table ind-table-md bottom">
                <tbody>
                    <tr>
                        <td class="ind-td left"><a href="{{ url('organization_list') }}">{{ _('Organizations') }}</a></td>
                        <td class="ind-td right"><a href="{{ url('user_list') }}">{{ _('View all') }} >>></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
