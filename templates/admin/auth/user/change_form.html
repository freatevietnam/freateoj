{% extends "admin/change_form.html" %}
{% load i18n %}

{% block extrahead %}{{ block.super }}
    <script>
        django.jQuery(function ($) {
            $('.profilelink').appendTo('div#bottombar').show();
            $('.createprofilelink').appendTo('div#bottombar').show();
        });
    </script>
{% endblock extrahead %}

{% block after_field_sets %}{{ block.super }}
    {% if original.profile_id %}
        <a style="display: none" title="{% trans "Edit profile" %}" href="{% url 'admin:judge_profile_change' original.profile.pk %}"
           class="button profilelink">
            <i class="fa fa-lg fa-user-plus"></i>
            <span class="text">{% trans "Edit profile" %}</span>
        </a>
    {% else %}
        <a style="display: none" title="{% trans "Create profile" %}" href="{% url 'create_profile' original.pk %}"
           class="button createprofilelink">
            <i class="fa fa-lg fa-user-plus"></i>
            <span class="text">{% trans "Create profile" %}</span>
        </a>
    {% endif %}
{% endblock %}
