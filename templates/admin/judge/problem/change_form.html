{% extends "admin/change_form.html" %}
{% load i18n %}

{% block extrahead %}{{ block.super }}
    <script>
        django.jQuery(function ($) {
            $('.submissions-link').appendTo('div#bottombar').show();
        });
    </script>
{% endblock extrahead %}

{% block after_field_sets %}{{ block.super }}
    {% if original %}
        <button style="display: none" title="{% trans "View Submissions" %}" class="ind-btn-ghost ind-flex-1 ind-flex-center-text ind-btn-orange brutalist-btn submissions-link"
           onclick="window.location.href='{% url 'admin:judge_submission_changelist' %}?problem__code={{ original.code }}'">
            <i class="fa fa-lg fa-search-plus"></i>
            <span class="text">{% trans "View submissions" %}</span>
        </a>
    {% endif %}
{% endblock %}
